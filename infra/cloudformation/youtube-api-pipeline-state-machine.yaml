AWSTemplateFormatVersion: "2010-09-09"
Description: Orchestrate YouTube API ingestion and daily Silver video processing.

Parameters:
  StateMachineName:
    Type: String
    Default: yt-youtube-api-pipeline
    Description: Name of the Step Functions state machine.

  YouTubeApiIngestionFunctionName:
    Type: String
    Default: yt-youtube-api-ingestion
    Description: Lambda function that ingests YouTube API data into Bronze.

  SilverVideoGlueJobName:
    Type: String
    Default: yt-silver-video-transform
    Description: Glue job that transforms Bronze video data into Silver.

  SnsTopicArn:
    Type: String
    Description: SNS topic ARN for pipeline success/failure notifications.

  ScheduleExpression:
    Type: String
    Default: rate(1 day)
    Description: EventBridge schedule for running the pipeline.

  EnableSchedule:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Whether to enable the EventBridge schedule.

Conditions:
  ScheduleEnabled: !Equals [!Ref EnableSchedule, "true"]

Resources:
  PipelineStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StateMachineName}-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${StateMachineName}-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: InvokeIngestionLambda
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${YouTubeApiIngestionFunctionName}"
              - Sid: RunSilverGlueJob
                Effect: Allow
                Action:
                  - glue:StartJobRun
                  - glue:GetJobRun
                  - glue:GetJobRuns
                  - glue:BatchStopJobRun
                Resource: !Sub "arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:job/${SilverVideoGlueJobName}"
              - Sid: PublishPipelineNotifications
                Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref SnsTopicArn

  PipelineStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Ref StateMachineName
      RoleArn: !GetAtt PipelineStateMachineRole.Arn
      DefinitionString: !Sub
        - |
          {
            "Comment": "YouTube API Bronze-to-daily-Silver pipeline",
            "StartAt": "Run YouTube API Ingestion",
            "States": {
              "Run YouTube API Ingestion": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "${IngestionFunctionArn}",
                  "Payload.$": "$"
                },
                "ResultPath": "$.Ingestion",
                "Catch": [
                  {
                    "ErrorEquals": ["States.ALL"],
                    "ResultPath": "$.Error",
                    "Next": "Notify Failure"
                  }
                ],
                "Next": "Check Ingestion Status"
              },
              "Check Ingestion Status": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.Ingestion.Payload.statusCode",
                    "NumericEquals": 200,
                    "Next": "Run Silver Video Glue Job"
                  }
                ],
                "Default": "Notify Failure"
              },
              "Run Silver Video Glue Job": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::glue:startJobRun.sync",
                "Parameters": {
                  "JobName": "${SilverVideoGlueJobName}",
                  "Arguments": {
                    "--SOURCE": "youtube_api",
                    "--PROCESS_DATE.$": "$.Ingestion.Payload.process_date"
                  }
                },
                "ResultPath": "$.SilverVideoGlue",
                "Catch": [
                  {
                    "ErrorEquals": ["States.ALL"],
                    "ResultPath": "$.Error",
                    "Next": "Notify Failure"
                  }
                ],
                "Next": "Notify Success"
              },
              "Notify Success": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::sns:publish",
                "Parameters": {
                  "TopicArn": "${SnsTopicArn}",
                  "Subject": "[YT Pipeline] YouTube API batch succeeded",
                  "Message.$": "States.JsonToString($)"
                },
                "End": true
              },
              "Notify Failure": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::sns:publish",
                "Parameters": {
                  "TopicArn": "${SnsTopicArn}",
                  "Subject": "[YT Pipeline] YouTube API batch failed",
                  "Message.$": "States.JsonToString($)"
                },
                "Next": "Fail Pipeline"
              },
              "Fail Pipeline": {
                "Type": "Fail",
                "Error": "YouTubeApiPipelineFailed"
              }
            }
          }
        - IngestionFunctionArn: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${YouTubeApiIngestionFunctionName}"

  EventBridgeInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StateMachineName}-eventbridge-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${StateMachineName}-eventbridge-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !Ref PipelineStateMachine

  PipelineSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${StateMachineName}-schedule"
      Description: Scheduled trigger for the YouTube API pipeline.
      ScheduleExpression: !Ref ScheduleExpression
      State: !If [ScheduleEnabled, ENABLED, DISABLED]
      Targets:
        - Arn: !Ref PipelineStateMachine
          Id: PipelineStateMachineTarget
          RoleArn: !GetAtt EventBridgeInvokeRole.Arn

Outputs:
  StateMachineArn:
    Description: Step Functions state machine ARN.
    Value: !Ref PipelineStateMachine

  ScheduleName:
    Description: EventBridge schedule rule name.
    Value: !Ref PipelineSchedule
